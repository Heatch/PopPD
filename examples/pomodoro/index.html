<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pomodoro</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='18' r='11' fill='%23e06445'/%3E%3Cpath d='M16 8c-.7-2.4-2.4-3.6-4.8-3.9 1.1 2.1 2.2 3.4 2.7 4.4' stroke='%235f8a6f' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3Cpath d='M16.3 8.2C16.8 5.5 18.4 4.3 20.6 3.9c-.6 2.4-1.7 3.7-2.9 4.5' stroke='%235f8a6f' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root{
    --ink:#2a2522;
    --ink-soft:#7d736c;
    --cream:#f7f2ea;
    --card:#fffdf9;
    --line:#ece3d7;
    --tomato:#e06445;
    --tomato-deep:#c9502f;
    --sage:#5f8a6f;
    --track:#efe7db;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,sans-serif;
    color:var(--ink);
    background:var(--cream);
    display:flex;align-items:safe center;justify-content:center;
    padding:24px;
    -webkit-font-smoothing:antialiased;
    position:relative;overflow-x:hidden;overflow-y:auto;
    transition:background .8s ease;
  }
  body::before,body::after{
    content:"";position:fixed;border-radius:50%;filter:blur(70px);opacity:.55;pointer-events:none;
    transition:background 1s ease;
  }
  body::before{
    width:520px;height:520px;background:#f6d3bd;
    top:-190px;left:-140px;
  }
  body::after{
    width:460px;height:460px;background:#d9e6d3;
    bottom:-210px;right:-150px;
  }
  body.break::before{background:#cfe3d6;}
  body.break::after{background:#f8e3c4;}

  .app{
    position:relative;
    width:min(440px,100%);
    background:var(--card);
    border:1px solid rgba(255,255,255,.8);
    border-radius:32px;
    padding:26px 30px 24px;
    box-shadow:
      0 1px 0 rgba(255,255,255,.9) inset,
      0 22px 55px -22px rgba(88,64,44,.38),
      0 4px 14px -8px rgba(88,64,44,.18);
    text-align:center;
  }

  /* top bar */
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
  .brand{display:flex;align-items:center;gap:8px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;}
  .brand svg{width:15px;height:15px;}
  .today{font-size:13px;color:var(--ink-soft);letter-spacing:.02em;}

  /* mode switch */
  .modes{
    display:inline-flex;gap:4px;padding:4px;border-radius:999px;
    background:#f4ece2;margin-bottom:20px;
  }
  .modes button{
    border:0;background:transparent;color:var(--ink-soft);
    font:inherit;font-size:13.5px;font-weight:600;
    padding:8px 18px;border-radius:999px;cursor:pointer;
    transition:background .25s ease,color .25s ease,box-shadow .25s ease;
  }
  .modes button[aria-selected="true"]{
    background:var(--card);color:var(--ink);
    box-shadow:0 2px 8px -3px rgba(88,64,44,.35),0 1px 0 rgba(255,255,255,.9) inset;
  }

  /* ring */
  .dial{position:relative;width:270px;height:270px;margin:0 auto 6px;}
  .dial svg{display:block;width:100%;height:100%;transform:rotate(-90deg);}
  .track{stroke:var(--track);}
  .prog{
    stroke:var(--tomato);
    transition:stroke .6s ease;
    stroke-linecap:round;
  }
  body.break .prog{stroke:var(--sage);}

  .face{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2px;
  }
  .time{
    font-size:62px;font-weight:350;letter-spacing:-.03em;line-height:1;
    font-variant-numeric:tabular-nums;color:var(--ink);
  }
  .label{
    font-size:11.5px;text-transform:uppercase;letter-spacing:.2em;
    color:var(--ink-soft);font-weight:600;margin-top:9px;
  }
  .message{
    min-height:22px;font-size:13.5px;color:var(--ink-soft);
    margin-top:6px;line-height:1.4;
  }

  /* buttons */
  .controls{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:4px;}
  .btn{
    font:inherit;cursor:pointer;border-radius:999px;border:1px solid transparent;
    transition:transform .15s ease,background .25s ease,box-shadow .25s ease,color .25s;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn:active{transform:scale(.97);}
  .primary{
    background:var(--tomato);color:#fff;font-size:15px;font-weight:600;
    padding:13px 42px;min-width:150px;
    box-shadow:0 10px 22px -10px rgba(224,100,69,.85);
  }
  .primary:hover{background:var(--tomato-deep);}
  body.break .primary{background:var(--sage);box-shadow:0 10px 22px -10px rgba(95,138,111,.85);}
  body.break .primary:hover{background:#4e765d;}
  .ghost{
    background:#f6efe5;color:var(--ink-soft);width:44px;height:44px;
  }
  .ghost:hover{background:#efe5d7;color:var(--ink);}
  .ghost svg{width:17px;height:17px;}

  .skip{
    margin-top:14px;background:none;border:0;font:inherit;font-size:12.5px;
    color:var(--ink-soft);cursor:pointer;text-decoration:underline dotted;
    text-underline-offset:3px;padding:4px;
  }
  .skip:hover{color:var(--ink);}

  /* footer */
  .foot{
    margin-top:20px;padding-top:18px;border-top:1px solid var(--line);
    display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
    text-align:left;
  }
  .foot>div:first-child{flex:1;min-width:0;}
  .count-label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;}
  .dots{display:flex;align-items:center;gap:5px;margin-top:8px;flex-wrap:wrap;}
  .dot{
    width:11px;height:11px;border-radius:50%;background:#efe5d6;
    border:1px solid #e3d5c2;
    transition:background .3s ease,border-color .3s;
  }
  .dot.full{background:var(--tomato);border-color:var(--tomato);}
  .dot.pop{animation:pop .5s cubic-bezier(.2,.9,.3,1.4);}
  @keyframes pop{
    0%{transform:scale(.3);opacity:.3;}
    60%{transform:scale(1.4);}
    100%{transform:scale(1);animation-timing-function:ease-out;}
  }
  .dot.extra{
    width:auto;height:auto;padding:1px 7px;border-radius:999px;border:0;background:transparent;
    color:var(--ink-soft);font-size:11.5px;font-weight:600;
  }
  .total{font-size:26px;font-weight:400;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .total b{font-weight:400;}
  .total span{font-size:12px;color:var(--ink-soft);font-weight:500;letter-spacing:.02em;margin-left:4px;}

  /* adjust panel */
  .adjust-toggle{
    background:none;border:0;font:inherit;font-size:12.5px;color:var(--ink-soft);
    cursor:pointer;padding:6px 2px;letter-spacing:.02em;
  }
  .adjust-toggle:hover{color:var(--ink);}
  .adjust{
    display:none;margin-top:14px;gap:18px;justify-content:center;
    border-top:1px solid var(--line);padding-top:16px;
  }
  .adjust.open{display:flex;}
  .stepper{display:flex;align-items:center;gap:10px;}
  .stepper .name{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-soft);font-weight:600;}
  .stepper button{
    width:24px;height:24px;border-radius:50%;border:1px solid #e6dbcc;background:#faf5ed;
    color:var(--ink-soft);font-size:14px;line-height:1;cursor:pointer;font-family:inherit;
  }
  .stepper button:hover{background:#f1e7d9;color:var(--ink);}
  .stepper .val{font-size:14px;font-variant-numeric:tabular-nums;min-width:20px;}
  @media (max-width:480px){
    .app{padding:22px 20px 20px;border-radius:26px;}
    .dial{width:232px;height:232px;}
    .time{font-size:54px;}
    .primary{padding:13px 30px;min-width:132px;}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>
<body>
  <main class="app">
    <div class="top">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="13.5" r="7.5" fill="#e06445"/>
          <path d="M12 6c-.6-2-2-3-4-3.2C8.9 4.6 9.8 5.7 10.2 6.6" stroke="#5f8a6f" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M12.2 6.2C12.6 4 14 3 15.8 2.6c-.5 2-1.4 3-2.4 3.7" stroke="#5f8a6f" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        Pomodoro
      </div>
      <div class="today" id="todayText">—</div>
    </div>

    <div class="modes" role="tablist" aria-label="Timer mode">
      <button role="tab" id="modeFocus" aria-selected="true">Focus</button>
      <button role="tab" id="modeBreak" aria-selected="false">Break</button>
    </div>

    <div class="dial">
      <svg viewBox="0 0 270 270" aria-hidden="true">
        <circle class="track" cx="135" cy="135" r="120" fill="none" stroke-width="9"/>
        <circle class="prog" id="ring" cx="135" cy="135" r="120" fill="none" stroke-width="9"
                stroke-dasharray="753.98" stroke-dashoffset="0"/>
      </svg>
      <div class="face">
        <div class="time" id="time" aria-live="off">25:00</div>
        <div class="label" id="modeLabel">Focus stretch</div>
      </div>
    </div>

    <p class="message" id="message" role="status" aria-live="polite">Ready when you are.</p>

    <div class="controls">
      <button class="btn ghost" id="reset" title="Start this stretch over" aria-label="Reset timer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4.5V10h5.5"/>
        </svg>
      </button>
      <button class="btn primary" id="toggle">Start</button>
      <button class="btn ghost" id="soundBtn" title="Mute the chime" aria-label="Toggle sound">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" id="soundIcon">
          <path d="M11 5 6.5 9H3v6h3.5L11 19z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>
        </svg>
      </button>
    </div>

    <button class="skip" id="skip">Skip to break</button>

    <div class="foot">
      <div>
        <div class="count-label">Stretches today</div>
        <div class="dots" id="dots"></div>
      </div>
      <div class="total"><b id="count">0</b><span>done</span></div>
    </div>

    <div style="margin-top:6px">
      <button class="adjust-toggle" id="adjustToggle">Adjust lengths</button>
    </div>
    <div class="adjust" id="adjust">
      <div class="stepper">
        <span class="name">Focus</span>
        <button data-step="focus" data-dir="-1" aria-label="Shorter focus">−</button>
        <span class="val" id="focusVal">25</span>
        <button data-step="focus" data-dir="1" aria-label="Longer focus">+</button>
      </div>
      <div class="stepper">
        <span class="name">Break</span>
        <button data-step="break" data-dir="-1" aria-label="Shorter break">−</button>
        <span class="val" id="breakVal">5</span>
        <button data-step="break" data-dir="1" aria-label="Longer break">+</button>
      </div>
    </div>
  </main>

<script>
(function(){
  const RING_LEN = 2 * Math.PI * 120;
  const ring = document.getElementById('ring');
  const timeEl = document.getElementById('time');
  const modeLabel = document.getElementById('modeLabel');
  const msgEl = document.getElementById('message');
  const toggleBtn = document.getElementById('toggle');
  const resetBtn = document.getElementById('reset');
  const skipBtn = document.getElementById('skip');
  const soundBtn = document.getElementById('soundBtn');
  const soundIcon = document.getElementById('soundIcon');
  const dotsEl = document.getElementById('dots');
  const countEl = document.getElementById('count');
  const todayEl = document.getElementById('todayText');
  const modeFocus = document.getElementById('modeFocus');
  const modeBreak = document.getElementById('modeBreak');
  const adjustToggle = document.getElementById('adjustToggle');
  const adjustPanel = document.getElementById('adjust');
  const focusValEl = document.getElementById('focusVal');
  const breakValEl = document.getElementById('breakVal');

  ring.setAttribute('stroke-dasharray', RING_LEN.toFixed(2));

  const DEFAULT_FOCUS = 25 * 60 * 1000;
  const DEFAULT_BREAK = 5 * 60 * 1000;

  const store = {
    get(key, fallback){
      try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); }
      catch(e){ return fallback; }
    },
    set(key, val){ try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){} }
  };

  const todayKey = () => {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  };

  let focusMs = clampMinutes(store.get('pomo.focus', DEFAULT_FOCUS), 5, 90, DEFAULT_FOCUS);
  let breakMs = clampMinutes(store.get('pomo.break', DEFAULT_BREAK), 1, 30, DEFAULT_BREAK);

  function clampMinutes(v, lo, hi, fallback){
    if (typeof v !== 'number' || !isFinite(v)) return fallback;
    return Math.min(hi, Math.max(lo, Math.round(v / 60000))) * 60000;
  }

  let mode = 'focus';
  let totalMs = focusMs;
  let remainingMs = focusMs;
  let running = false;
  let endAt = 0;
  let rafId = null;
  let muted = store.get('pomo.muted', false);

  // ---- today's count ----
  let stored = store.get('pomo.today', null);
  let count = 0;
  if (stored && stored.date === todayKey() && typeof stored.count === 'number'){
    count = stored.count;
  } else {
    store.set('pomo.today', { date: todayKey(), count: 0 });
  }

  function saveCount(){
    store.set('pomo.today', { date: todayKey(), count: count });
  }

  function renderCount(animate){
    countEl.textContent = count;
    dotsEl.innerHTML = '';
    const SLOTS = 8;
    for (let i = 0; i < SLOTS; i++){
      const d = document.createElement('div');
      const filled = i < count;
      d.className = 'dot' + (filled ? ' full' : '') + (animate && filled && i === count - 1 ? ' pop' : '');
      dotsEl.appendChild(d);
    }
    if (count > SLOTS){
      const e = document.createElement('div');
      e.className = 'dot extra';
      e.textContent = '+' + (count - SLOTS);
      dotsEl.appendChild(e);
    }
  }

  function renderToday(){
    todayEl.textContent = new Date().toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
  }

  // ---- display ----
  function fmt(ms){
    const total = Math.max(0, Math.ceil(ms / 1000));
    const m = Math.floor(total / 60);
    const s = total % 60;
    return m + ':' + String(s).padStart(2,'0');
  }

  function paint(){
    const shown = running ? Math.max(0, endAt - Date.now()) : remainingMs;
    timeEl.textContent = fmt(shown);
    const frac = totalMs > 0 ? Math.min(1, Math.max(0, shown / totalMs)) : 0;
    ring.setAttribute('stroke-dashoffset', (RING_LEN * (1 - frac)).toFixed(2));
    document.title = (running ? fmt(shown) + ' · ' : '') + (mode === 'focus' ? 'Focus' : 'Break') + ' — Pomodoro';
  }

  function paintMode(){
    document.body.classList.toggle('break', mode === 'break');
    modeFocus.setAttribute('aria-selected', mode === 'focus' ? 'true' : 'false');
    modeBreak.setAttribute('aria-selected', mode === 'break' ? 'true' : 'false');
    modeLabel.textContent = mode === 'focus' ? 'Focus stretch' : 'Short break';
    skipBtn.textContent = mode === 'focus' ? 'Skip to break' : 'Back to focus';
    totalMs = mode === 'focus' ? focusMs : breakMs;
  }

  function setMode(next, { keepMessage = false } = {}){
    stopLoop();
    running = false;
    mode = next;
    paintMode();
    remainingMs = totalMs;
    paint();
    setToggleLabel();
    if (!keepMessage) msgEl.textContent = mode === 'focus' ? 'Ready when you are.' : 'Step away for a moment.';
  }

  function setToggleLabel(){
    toggleBtn.textContent = running ? 'Pause' : (remainingMs < totalMs && remainingMs > 0 ? 'Resume' : 'Start');
  }

  // ---- timer loop ----
  function loop(){
    if (!running) return;
    const left = endAt - Date.now();
    if (left <= 0){
      remainingMs = 0;
      paint();
      finish();
      return;
    }
    remainingMs = left;
    paint();
    rafId = requestAnimationFrame(loop);
  }

  function stopLoop(){
    if (rafId !== null){ cancelAnimationFrame(rafId); rafId = null; }
  }

  function primeAudio(){
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch(e){}
  }

  function start(){
    if (running) return;
    if (remainingMs <= 0) remainingMs = totalMs;
    primeAudio();
    endAt = Date.now() + remainingMs;
    running = true;
    setToggleLabel();
    msgEl.textContent = mode === 'focus' ? 'Settle in. One thing at a time.' : 'Step away for a moment.';
    askNotify();
    loop();
  }

  function pause(){
    if (!running) return;
    remainingMs = Math.max(0, endAt - Date.now());
    running = false;
    stopLoop();
    paint();
    setToggleLabel();
    msgEl.textContent = 'Paused.';
  }

  function finish(){
    stopLoop();
    running = false;
    setToggleLabel();

    if (mode === 'focus'){
      count += 1;
      saveCount();
      renderCount(true);
      chime('focus');
      notify('Stretch complete', 'Nice work. Your break is ready — ' + Math.round(breakMs/60000) + ' minutes.');
      setMode('break', { keepMessage: true });
      msgEl.textContent = 'That’s ' + count + (count === 1 ? ' stretch' : ' stretches') + ' today. Take a break.';
    } else {
      chime('break');
      notify('Break over', 'Ready for another focus stretch?');
      setMode('focus', { keepMessage: true });
      msgEl.textContent = 'Break’s over. Ready when you are.';
    }
    paint();
  }

  // ---- sound ----
  let audioCtx = null;
  function tone(freq, startAt, dur, gainVal){
    const ctx = audioCtx;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, startAt);
    gain.gain.linearRampToValueAtTime(gainVal, startAt + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, startAt + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(startAt);
    osc.stop(startAt + dur + 0.05);
  }

  function chime(kind){
    if (muted) return;
    try {
      primeAudio();
      const t = audioCtx.currentTime + 0.05;
      if (kind === 'focus'){
        tone(659.25, t, 0.7, 0.16);
        tone(830.61, t + 0.16, 0.8, 0.13);
        tone(987.77, t + 0.32, 1.1, 0.10);
      } else {
        tone(783.99, t, 0.6, 0.14);
        tone(587.33, t + 0.15, 0.9, 0.11);
      }
    } catch(e){}
  }

  function setSoundIcon(){
    soundIcon.innerHTML = muted
      ? '<path d="M11 5 6.5 9H3v6h3.5L11 19z"/><path d="M16 9.5l4.5 5M20.5 9.5 16 14.5"/>'
      : '<path d="M11 5 6.5 9H3v6h3.5L11 19z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>';
    soundBtn.title = muted ? 'Unmute the chime' : 'Mute the chime';
  }

  // ---- notifications ----
  let askedNotify = false;
  function askNotify(){
    if (askedNotify) return;
    askedNotify = true;
    try {
      if ('Notification' in window && Notification.permission === 'default'){
        Notification.requestPermission();
      }
    } catch(e){}
  }
  function notify(title, body){
    try {
      if ('Notification' in window && Notification.permission === 'granted'){
        new Notification(title, { body: body, silent: true });
      }
    } catch(e){}
  }

  // ---- wiring ----
  toggleBtn.addEventListener('click', function(){
    if (running) pause(); else start();
  });

  resetBtn.addEventListener('click', function(){
    stopLoop();
    running = false;
    remainingMs = totalMs;
    setToggleLabel();
    paint();
    msgEl.textContent = mode === 'focus' ? 'Ready when you are.' : 'Step away for a moment.';
  });

  skipBtn.addEventListener('click', function(){
    if (mode === 'focus'){
      setMode('break');
    } else {
      setMode('focus');
    }
  });

  modeFocus.addEventListener('click', function(){
    if (mode !== 'focus') setMode('focus');
  });
  modeBreak.addEventListener('click', function(){
    if (mode !== 'break') setMode('break');
  });

  soundBtn.addEventListener('click', function(){
    muted = !muted;
    store.set('pomo.muted', muted);
    setSoundIcon();
    if (!muted) chime('break');
  });

  adjustToggle.addEventListener('click', function(){
    adjustPanel.classList.toggle('open');
    adjustToggle.textContent = adjustPanel.classList.contains('open') ? 'Hide lengths' : 'Adjust lengths';
  });

  document.querySelectorAll('.stepper button').forEach(function(b){
    b.addEventListener('click', function(){
      const which = b.dataset.step;
      const dir = Number(b.dataset.dir);
      if (which === 'focus'){
        focusMs = Math.min(90, Math.max(5, focusMs / 60000 + dir * 5)) * 60000;
        store.set('pomo.focus', focusMs);
        focusValEl.textContent = focusMs / 60000;
      } else {
        breakMs = Math.min(30, Math.max(1, breakMs / 60000 + dir)) * 60000;
        store.set('pomo.break', breakMs);
        breakValEl.textContent = breakMs / 60000;
      }
      if (!running && mode === (which === 'focus' ? 'focus' : 'break')){
        totalMs = mode === 'focus' ? focusMs : breakMs;
        remainingMs = totalMs;
        setToggleLabel();
        paint();
      }
    });
  });

  document.addEventListener('keydown', function(e){
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.target.closest && e.target.closest('button')) return;
    if (e.code === 'Space' || e.key === 'k'){
      e.preventDefault();
      if (running) pause(); else start();
    } else if (e.key === 'r' || e.key === 'R'){
      resetBtn.click();
    }
  });

  // catches the finish even when the tab is in the background and the smooth loop is paused
  setInterval(function(){
    if (running && Date.now() >= endAt){
      remainingMs = 0;
      paint();
      finish();
    }
  }, 500);

  // refresh the day rollover while open
  setInterval(function(){
    const k = todayKey();
    const s = store.get('pomo.today', null);
    if (!s || s.date !== k){
      count = 0;
      saveCount();
      renderCount();
    }
    renderToday();
  }, 30000);

  // ---- boot ----
  focusValEl.textContent = focusMs / 60000;
  breakValEl.textContent = breakMs / 60000;
  setSoundIcon();
  renderToday();
  renderCount();
  paintMode();
  remainingMs = totalMs;
  paint();
  setToggleLabel();
})();
</script>
</body>
</html>
